[tools]
go = "1.27.2"
"go:gotest.tools/gotestsum" = "1.13.0"
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.14.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[env]
CGO_ENABLED = "0"

# ---- build & run -----------------------------------------------------------

[tasks.build]
description = "Build the chromectl binary into ./bin"
run = "go build -o bin/chromectl ./cmd/chromectl"

[tasks.chromectl]
description = "Build from source and run in your shell's directory. Usage: mise run chromectl -- <args>"
run = 'cd "$MISE_PROJECT_ROOT" && go build -o bin/chromectl ./cmd/chromectl && cd "${MISE_ORIGINAL_CWD:-$PWD}" && exec "$MISE_PROJECT_ROOT/bin/chromectl"'

[tasks.install]
description = "Build, then register ./bin/chromectl as the extension's native messaging host"
depends = ["build"]
run = "./bin/chromectl install"

[tasks.drive]
description = "Run ./bin/chromectl host against a scripted fake Chrome and exercise the CLI; no display needed"
depends = ["build"]
run = 'python3 scripts/fakechrome.py "$(mktemp -d)"'

# ---- format / vet / lint / tidy --------------------------------------------

[tasks.fmt]
description = "Format Go source (goimports)"
run = "goimports -local github.com/hk9890/chromectl -w cmd internal"

[tasks."fmt:check"]
description = "Fail if any file is not formatted"
run = """
# 2>&1 folds goimports' own diagnostics into $OUT so a broken run cannot pass.
OUT=$(goimports -local github.com/hk9890/chromectl -l cmd internal 2>&1) || { echo "goimports failed:"; echo "$OUT"; exit 1; }
if [ -n "$OUT" ]; then echo "unformatted:"; echo "$OUT"; exit 1; fi
"""

[tasks.vet]
run = "go vet ./..."

[tasks.lint]
description = "golangci-lint at the pinned version"
run = "golangci-lint run --timeout=5m ./..."

[tasks.tidy]
run = "go mod tidy"

[tasks.vuln]
description = "govulncheck (reaches the network; CI-only gate)"
run = "govulncheck ./..."

# ---- tests -----------------------------------------------------------------

[tasks.test]
description = "Run the tests"
run = "gotestsum --format pkgname-and-test-fails -- ./..."

[tasks."test:race"]
description = "Run the tests under the race detector, three times; needs cgo"
env = { CGO_ENABLED = "1" }
run = "gotestsum --format pkgname-and-test-fails -- -race -count=3 ./..."

# ---- gates -----------------------------------------------------------------

[tasks.quality]
description = "The pre-commit gate"
depends = ["fmt:check", "vet", "lint", "build", "test:race"]
