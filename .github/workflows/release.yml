name: Release

# Releases are published by dispatching this workflow by hand against a release
# tag (docs/RELEASING.md). workflow_dispatch rather than `push: tags: v*` so
# that re-tagging or history maintenance cannot publish a release by accident.
on:
  workflow_dispatch:

# Least-privilege default; the release job widens itself.
permissions:
  contents: read

# Two runs against one tag would replace each other's assets mid-upload.
concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write       # release notes and asset upload
      id-token: write       # cosign keyless signing and SLSA attestation OIDC
      attestations: write   # actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A restored build cache would link objects compiled by another run
          # into the published binaries.
          cache: false

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: CGO_ENABLED=1 go test -race ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign v3 defaults to --new-bundle-format, which rejects the
          # --output-signature/--output-certificate flags in .goreleaser.yaml.
          cosign-release: 'v2.6.5'

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # The tag's CHANGELOG.md section is the release text. A tag with no
      # section fails here, before anything is published.
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release is for the dispatched tag, the one the notes are for,
          # even when another tag points at the same commit.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Generate SLSA build provenance for release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt
