name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege default token: build, test and lint need read access only.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is checked in the Lint job, which already has mise. It cannot
      # run here: mise-action exports .mise.toml's [env], including
      # CGO_ENABLED=0, into the job - and the race detector needs cgo.

      - name: vet
        run: go vet ./...

      - name: test (race, three runs)
        run: CGO_ENABLED=1 go test -race -count=3 ./...

      - name: build
        run: go build -o bin/chromectl ./cmd/chromectl

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise (pins go, goimports, golangci-lint)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      # The format gate is defined once, in .mise.toml, and run from there -
      # never re-spelled as `gofmt`.
      - name: fmt-check
        run: mise run fmt:check

      - name: golangci-lint
        run: mise run lint

      # Reaches the network for the vulnerability database, so it runs here
      # rather than in the pre-commit gate.
      - name: vuln
        run: mise run vuln

  drive:
    name: Drive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The drive needs go alone; the Lint job's cache holds every tool.
      - name: Set up mise (go only)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: go
          cache_key_prefix: mise-drive

      # The built binary as Chrome starts it, against scripts/fakechrome.py:
      # the only layer that runs the host's socket lifecycle and exit codes.
      - name: drive
        run: mise run drive
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
